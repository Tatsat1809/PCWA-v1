    <script>
        // 60 questions from practice.JSON
        // Add KaTeX JS and auto-render after DOMContentLoaded
        const katexScript = document.createElement('script');
        katexScript.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js';
        katexScript.defer = true;
        document.head.appendChild(katexScript);
        const autoRenderScript = document.createElement('script');
        autoRenderScript.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js';
        autoRenderScript.defer = true;
        document.head.appendChild(autoRenderScript);

        // Use inline `questions` array (defined later in the page) instead of fetching
        // an external JSON file. Wrap initialization so it runs after the DOM is ready
        // and after the inline `questions` variable is parsed.
        document.addEventListener('DOMContentLoaded', function initQuestions() {
            // Ensure the inline `questions` variable exists
            if (typeof questions === 'undefined' || !Array.isArray(questions) || questions.length === 0) {
                document.getElementById('question-container').innerHTML = '<p style="color:#b71c1c;">Unable to load questions. Please contact the site administrator.</p>';
                console.error('Inline questions array missing or empty.');
                return;
            }

            let current = 0;
            function renderMath(targetEl) {
                if (!targetEl) return;
                if (window.renderMathInElement) {
                    renderMathInElement(targetEl, {
                        delimiters: [
                            { left: "$", right: "$", display: false },
                            { left: "$$", right: "$$", display: true }
                        ]
                    });
                } else {
                    // Try again shortly if KaTeX auto-render isn't loaded yet
                    setTimeout(function () { renderMath(targetEl); }, 100);
                }
            }

            function showQuestion(idx) {
                const q = questions[idx];
                let html = `<section class='question-card'><h2>Question ${idx + 1} of ${questions.length}</h2><p>${q.question.replace(/\n/g, '<br>')}</p>`;
                if (q.type === 'mcq' && Array.isArray(q.choices)) {
                    html += `<ul class='choices'>`;
                    q.choices.forEach((c, i) => {
                        html += `<li><label><input type='radio' name='choice' value='${i}'> ${c}</label></li>`;
                    });
                    html += `</ul>`;
                } else if (q.type === 'short_answer') {
                    html += `<div class='short-answer-box'><label>Answer: <input type='text' style='width:60%;max-width:300px;'></label></div>`;
                }
                html += `<div id='solution' style='display:none; margin-top:1em; color:#1976d2;'><b>Answer:</b> ${q.answer ? q.answer : ''}<br><b>Solution:</b> ${q.solution ? q.solution : ''}</div></section>`;

                document.getElementById('question-container').innerHTML = html;

                // ✅ Re-render KaTeX every time a question loads
                if (window.renderMathInElement) {
                    renderMathInElement(document.getElementById('question-container'), {
                        delimiters: [
                            { left: "\\(", right: "\\)", display: false },
                            { left: "\\[", right: "\\]", display: true }
                        ]
                    });
                }
                renderMathInElement(document.body, {
                    delimiters: [
                        { left: "/", right: "/", display: false }
                    ]
                });

            }


            function toggleSolution() {
                const sol = document.getElementById('solution');
                const btn = document.getElementById('solution-btn');
                if (!sol) return;
                if (sol.style.display === 'block') {
                    sol.style.display = 'none';
                    btn.textContent = 'View Solution';
                } else {
                    sol.style.display = 'block';
                    btn.textContent = 'Hide Solution';
                    // Render math inside the solution container
                    renderMath(sol);
                }
            }

            document.getElementById('next-btn').onclick = function () {
                if (current < questions.length - 1) { current++; showQuestion(current); resetSolutionBtn(); }
            };
            document.getElementById('prev-btn').onclick = function () {
                if (current > 0) { current--; showQuestion(current); resetSolutionBtn(); }
            };
            document.getElementById('solution-btn').onclick = function () { toggleSolution(); };
            function resetSolutionBtn() {
                const btn = document.getElementById('solution-btn');
                btn.textContent = 'View Solution';
            }
            document.getElementById('jump-btn').onclick = function () {
                const val = parseInt(document.getElementById('jump-to-q').value, 10);
                if (!isNaN(val) && val >= 1 && val <= questions.length) {
                    current = val - 1;
                    showQuestion(current);
                    resetSolutionBtn();
                }
            };
            // Initial load
            showQuestion(current);
            resetSolutionBtn();
        });
    </script>
    <script>
        // Light/Dark Mode Toggle (Switch Style)
        const themeBtn = document.getElementById('themeToggleBtn');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');
        function setTheme(mode) {
            if (mode === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.classList.add('on');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.classList.remove('on');
            }
            localStorage.setItem('theme', mode);
        }
        // Initial theme
        if (savedTheme) {
            setTheme(savedTheme);
        } else {
            setTheme(prefersDark ? 'dark' : 'light');
        }
        themeBtn.addEventListener('click', function () {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });
    </script>
    <script>
        const questions = [
            {
                "type": "short_answer",
                "question": "Explain what '/n!/' (n factorial) means and compute /6!/.",
                "answer": "/n! = n·(n-1)·(n-2)·...·1/. /6! = 6·5·4·3·2·1 = 720/.",
                "solution": "Factorial definition: multiply all positive integers from /1/ to /n/. So /6! = 6×5×4×3×2×1 = 720/."
            },
            {
                "type": "short_answer",
                "question": "Using the counting principle: /5/ choices for appetizer, /4/ for main course, and /3/ for dessert. How many different meal combinations?",
                "answer": "/5 × 4 × 3 = 60/ combinations.",
                "solution": "By the Fundamental Counting Principle multiply the number of independent choices: /5·4·3 = 60/."
            },
            {
                "type": "mcq",
                "question": "A lock code has /4/ digits, each digit /0–9/. How many possible codes?",
                "choices": [
                    "/10000/",
                    "/1000/",
                    "/90000/",
                    "/100000/"
                ],
                "answer": "/10000/",
                "solution": "Each digit has /10/ choices and digits are independent, so /10·10·10·10 = 10^4 = 10000/."
            },
            {
                "type": "short_answer",
                "question": "From /3/ shirts, /2/ pants, /2/ shoes, how many outfits?",

                "solution": "Multiply choices for each clothing category: /3·2·2 = 12/."
            },
            {
                "type": "mcq",
                "question": "How many /5/-letter strings using distinct letters from /26/-letter alphabet?",
                "choices": [
                    "/7,893,600/",
                    "/65,780/",
                    "/7,500,000/",
                    "/6,000,000/"
                ],
                "answer": "/7,893,600/",

            },
            {
                "type": "short_answer",
                "question": "How many different /8/-digit numbers can you form if repetition is allowed?",
                "answer": "/9 × 10^7 = 90,000,000/ (if leading zero not allowed) or /10^8 = 100,000,000/ (if leading zero allowed).",
                "solution": "If leading zero allowed: /10/ choices per position → /10^8/. If leading zero not allowed (first digit /1–9/): /9·10^7/. Clarify convention before choosing."
            },
            {
                "type": "mcq",
                "question": "A license plate: /3/ letters followed by /3/ digits. Letters and digits may repeat. How many possible plates?",
                "choices": [
                    "/17,576,000/",
                    "/175,760/",
                    "/456,976/",
                    "/1,000,000/"
                ],
                "answer": "/17,576,000/",
                "solution": "Each letter slot: /26/ choices; each digit: /10/ choices. Multiply: /26^3·10^3 = 17,576,000/."
            },
            {
                "type": "mcq",
                "question": "In how many ways can you arrange the letters in the word 'MATH'?",
                "choices": [
                    "/24/",
                    "/12/",
                    "/48/",
                    "/6/"
                ],
                "answer": "/24/",
                "solution": "All letters distinct, so permutations: /4! = 24/."
            },
            {
                "type": "short_answer",
                "question": "What is the difference between permutation and combination? Give examples.",
                "answer": "Permutation: order matters (e.g., seating arrangements). Combination: order doesn't matter (e.g., choosing committee).",
                "solution": "Permutations count ordered arrangements, combinations count unordered selections. Example: /3/ people A,B,C: permutations of /2/ are AB, BA, AC, CA, BC, CB (/6/); combinations of /2/ are {A,B}, {A,C}, {B,C} (/3/)."
            },
            {
                "type": "mcq",
                "question": "How many ways to choose 3 students from a class of /10/ to be on a committee?",
                "choices": [
                    "/120/",
                    "/60/",
                    "/720/",
                    "/1000/"
                ],
                "answer": "/120/",
                "solution": "Use combinations: /10/ choose /3/ = \\(10!/3!7!\\) /= 120/."
            },
            {
                "type": "mcq",
                "question": "How many ways to seat /5/ students in /5/ chairs in a row?",
                "choices": [
                    "/120/",
                    "/60/",
                    "/24/",
                    "/720/"
                ],
                "answer": "/120/",

            },
            {
                "type": "short_answer",
                "question": "How many /4/-letter strings from A,B,C,D,E with no repeats?",
                "answer": "/P(5,4) = 5·4·3·2 = 120/.",
                "solution": "Permutations without repetition: /P(5,4) =/ \\(5!/(5-4)!\\) /= 120/."
            },
            {
                "type": "mcq",
                "question": "From /8/ people, how many ways to pick a president, vice-president, and secretary (distinct roles)?",
                "choices": [
                    "/336/",
                    "/56/",
                    "/168/",
                    "/24/"
                ],
                "answer": "/336/",
                "solution": "Ordered selection of /3/ roles: /P(8,3) = 8·7·6 = 336/."
            },
            {
                "type": "mcq",
                "question": "In how many ways can /8/ books be arranged on a shelf?",
                "choices": [
                    "/40320/",
                    "/5040/",
                    "/2880/",
                    "/362880/"
                ],
                "answer": "/40320/",
                "solution": "Permutations of /8/ distinct items: /8! = 40320/."
            },
            {
                "type": "short_answer",
                "question": "A team of /4/ chosen from /10/, but order matters (roles). How many ordered teams?",

                "solution": "Ordered selections: /P(10,4) =/ \\(10!/(10-4)!\\) /= 5040/."
            },
            {
                "type": "short_answer",
                "question": "From /9/ women and /6/ men, pick committee of /5/ with exactly /3/ women and /2/ men. How many ways?",

                "solution": "Choose /3/ women from /9/ and /2/ men from /6/, multiply independent choices: /84·15 = 1260/."
            },
            {
                "type": "short_answer",
                "question": "/6/ students want to stand in a circle. How many circular arrangements (rotations same)?",
                "answer": "/(6-1)! = 5! = 120/.",

            },
            {
                "type": "mcq",
                "question": "In how many ways can you choose /3/ out of /7/ books to take with you?",

                    "/21/",

                "answer": "/35/",

            },

                "choices": [
                    "/21/",
                    "/42/",
                    "/7/",
                    "/15/"
                ],
                "answer": "/21/",
                "solution": "Cancel /5!/: gives \\((7·6)/(2·1)\\) /=/ \\(42/2\\) /= 21/."
            },
            {
                "type": "mcq",
                "question": "Solve for /n/: \\(n!/(n-3)!\\) /= 120/.",

                    "/6/",
                    "/7/",
                    "/8/"

                "answer": "/6/",
                "solution": "\\(n!/(n-3)!\\) /= n(n-1)(n-2)/. Try /n=6/: /6·5·4 = 120/, so /n=6/."

            {
                "type": "short_answer",

                "solution": "Compute values or use identity /C(n,k)+C(n,k-1)=C(n+1,k)/. So /C(8,3)+C(8,2)=C(9,3)=84/."
            },
            {
                "type": "short_answer",
                "question": "Show that /P(n,r) = r! · C(n,r)/.",

            },
            {
                "type": "short_answer",

            {
                "type": "short_answer",

            {
