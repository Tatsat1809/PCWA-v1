    <script>
        // 60 questions from practice.JSON
        // Add KaTeX JS and auto-render after DOMContentLoaded
        const katexScript = document.createElement('script');
        katexScript.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js';
        katexScript.defer = true;
        document.head.appendChild(katexScript);
        const autoRenderScript = document.createElement('script');
        autoRenderScript.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js';
        autoRenderScript.defer = true;
        document.head.appendChild(autoRenderScript);

        // Use inline `questions` array (defined later in the page) instead of fetching
        // an external JSON file. Wrap initialization so it runs after the DOM is ready
        // and after the inline `questions` variable is parsed.
        document.addEventListener('DOMContentLoaded', function initQuestions() {
            // Ensure the inline `questions` variable exists
            if (typeof questions === 'undefined' || !Array.isArray(questions) || questions.length === 0) {
                document.getElementById('question-container').innerHTML = '<p style="color:#b71c1c;">Unable to load questions. Please contact the site administrator.</p>';
                console.error('Inline questions array missing or empty.');
                return;
            }

            let current = 0;
            function renderMath(targetEl) {
                if (!targetEl) return;
                if (window.renderMathInElement) {
                    renderMathInElement(targetEl, {
                        delimiters: [
                            { left: "$", right: "$", display: false },
                            { left: "$$", right: "$$", display: true }
                        ]
                    });
                } else {
                    // Try again shortly if KaTeX auto-render isn't loaded yet
                    setTimeout(function () { renderMath(targetEl); }, 100);
                }
            }

            function showQuestion(idx) {
                const q = questions[idx];
                let html = `<section class='question-card'><h2>Question ${idx + 1} of ${questions.length}</h2><p>${q.question.replace(/\n/g, '<br>')}</p>`;
                if (q.type === 'mcq' && Array.isArray(q.choices)) {
                    html += `<ul class='choices'>`;
                    q.choices.forEach((c, i) => {
                        html += `<li><label><input type='radio' name='choice' value='${i}'> ${c}</label></li>`;
                    });
                    html += `</ul>`;
                } else if (q.type === 'short_answer') {
                    html += `<div class='short-answer-box'><label>Answer: <input type='text' style='width:60%;max-width:300px;'></label></div>`;
                }
                html += `<div id='solution' style='display:none; margin-top:1em; color:#1976d2;'><b>Answer:</b> ${q.answer ? q.answer : ''}<br><b>Solution:</b> ${q.solution ? q.solution : ''}</div></section>`;

                document.getElementById('question-container').innerHTML = html;

                // ✅ Re-render KaTeX every time a question loads
                if (window.renderMathInElement) {
                    renderMathInElement(document.getElementById('question-container'), {
                        delimiters: [
                            { left: "\\(", right: "\\)", display: false },
                            { left: "\\[", right: "\\]", display: true }
                        ]
                    });
                }
                renderMathInElement(document.body, {
                    delimiters: [
                        { left: "/", right: "/", display: false }
                    ]
                });

            }


            function toggleSolution() {
                const sol = document.getElementById('solution');
                const btn = document.getElementById('solution-btn');
                if (!sol) return;
                if (sol.style.display === 'block') {
                    sol.style.display = 'none';
                    btn.textContent = 'View Solution';
                } else {
                    sol.style.display = 'block';
                    btn.textContent = 'Hide Solution';
                    // Render math inside the solution container
                    renderMath(sol);
                }
            }

            document.getElementById('next-btn').onclick = function () {
                if (current < questions.length - 1) { current++; showQuestion(current); resetSolutionBtn(); }
            };
            document.getElementById('prev-btn').onclick = function () {
                if (current > 0) { current--; showQuestion(current); resetSolutionBtn(); }
            };
            document.getElementById('solution-btn').onclick = function () { toggleSolution(); };
            function resetSolutionBtn() {
                const btn = document.getElementById('solution-btn');
                btn.textContent = 'View Solution';
            }
            document.getElementById('jump-btn').onclick = function () {
                const val = parseInt(document.getElementById('jump-to-q').value, 10);
                if (!isNaN(val) && val >= 1 && val <= questions.length) {
                    current = val - 1;
                    showQuestion(current);
                    resetSolutionBtn();
                }
            };
            // Initial load
            showQuestion(current);
            resetSolutionBtn();
        });
    </script>
    <script>
        // Light/Dark Mode Toggle (Switch Style)
        const themeBtn = document.getElementById('themeToggleBtn');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');
        function setTheme(mode) {
            if (mode === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.classList.add('on');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.classList.remove('on');
            }
            localStorage.setItem('theme', mode);
        }
        // Initial theme
        if (savedTheme) {
            setTheme(savedTheme);
        } else {
            setTheme(prefersDark ? 'dark' : 'light');
        }
        themeBtn.addEventListener('click', function () {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });
    </script>
